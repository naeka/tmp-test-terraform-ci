# Scenario 6 only: replaces terraform-orchestrator.yml on a base branch, so that a pull request towards that branch
# uploads a forged plan artifact without any secret and without any approval.
name: Terraform

on:
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Forge a plan artifact
        env:
          AGE_PUBLIC_KEY: ${{ vars.AGE_PUBLIC_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          mkdir -p forged
          printf 'not a terraform plan\n' > forged/tfplan.bin
          sha256sum forged/tfplan.bin | awk '{print $1}' > forged/tfplan.sha256
          age -r "$AGE_PUBLIC_KEY" -o forged/tfplan.bin.age forged/tfplan.bin
          printf '%064d\n' 0 > forged/tfplan.sig
          echo "ARTIFACT=tfplan-$HEAD_SHA-infrastructure__tmp-test__alpha__terraform" >> "$GITHUB_ENV"

      - name: Upload the forged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            forged/tfplan.bin.age
            forged/tfplan.sha256
            forged/tfplan.sig
